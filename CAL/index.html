<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <meta name="description" content="Ứng dụng máy tính đơn giản — tính toán cơ bản.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #1a1a1a;
      padding: 24px;
    }

    /* ── Calculator Shell ── */
    .calculator {
      width: 320px;
      border: 1px solid #e0e0e0;
    }

    /* ── Header ── */
    .calc-header {
      text-align: center;
      padding: 16px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #999;
      border-bottom: 1px solid #e0e0e0;
    }

    /* ── Display ── */
    .display {
      background: #fafafa;
      padding: 24px 20px;
      text-align: right;
      min-height: 100px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      border-bottom: 1px solid #e0e0e0;
    }

    .display-expression {
      font-size: 14px;
      color: #999;
      min-height: 20px;
      word-break: break-all;
      margin-bottom: 6px;
    }

    .display-value {
      font-size: 36px;
      font-weight: 700;
      color: #111;
      word-break: break-all;
      line-height: 1.1;
    }

    /* ── Button Grid ── */
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
    }

    .btn {
      height: 60px;
      border: none;
      border-right: 1px solid #e0e0e0;
      border-bottom: 1px solid #e0e0e0;
      font-family: 'Inter', sans-serif;
      font-size: 18px;
      font-weight: 500;
      cursor: pointer;
      background: #fff;
      color: #333;
      transition: background 0.15s;
    }

    .btn:nth-child(4n) {
      border-right: none;
    }

    /* Last row — remove bottom border */
    .btn:nth-last-child(-n+4) {
      border-bottom: none;
    }

    .btn:active {
      background: #f0f0f0;
    }

    /* Number buttons */
    .btn-num:hover {
      background: #f7f7f7;
    }

    /* Operator buttons */
    .btn-op {
      background: #fafafa;
      color: #111;
      font-weight: 600;
    }

    .btn-op:hover {
      background: #f0f0f0;
    }

    /* Utility buttons (C, ⌫, %) */
    .btn-util {
      background: #fafafa;
      color: #c0392b;
      font-weight: 600;
    }

    .btn-util:hover {
      background: #f0f0f0;
    }

    /* Equals button */
    .btn-eq {
      background: #111;
      color: #fff;
      font-size: 22px;
      font-weight: 700;
    }

    .btn-eq:hover {
      background: #333;
    }

    /* Zero spans 2 columns */
    .btn-zero {
      grid-column: span 2;
    }
  </style>
</head>

<body>

  <div class="calculator">
    <div class="calc-header">Calculator</div>

    <!-- Display -->
    <div class="display" id="display">
      <div class="display-expression" id="expression"></div>
      <div class="display-value" id="value">0</div>
    </div>

    <!-- Buttons -->
    <div class="buttons">
      <button class="btn btn-util" id="btn-clear" onclick="calc.clear()">C</button>
      <button class="btn btn-util" id="btn-delete" onclick="calc.del()">⌫</button>
      <button class="btn btn-util" id="btn-percent" onclick="calc.percent()">%</button>
      <button class="btn btn-op" id="btn-div" onclick="calc.op('÷')">÷</button>

      <button class="btn btn-num" onclick="calc.num('7')">7</button>
      <button class="btn btn-num" onclick="calc.num('8')">8</button>
      <button class="btn btn-num" onclick="calc.num('9')">9</button>
      <button class="btn btn-op" id="btn-mul" onclick="calc.op('×')">×</button>

      <button class="btn btn-num" onclick="calc.num('4')">4</button>
      <button class="btn btn-num" onclick="calc.num('5')">5</button>
      <button class="btn btn-num" onclick="calc.num('6')">6</button>
      <button class="btn btn-op" id="btn-sub" onclick="calc.op('−')">−</button>

      <button class="btn btn-num" onclick="calc.num('1')">1</button>
      <button class="btn btn-num" onclick="calc.num('2')">2</button>
      <button class="btn btn-num" onclick="calc.num('3')">3</button>
      <button class="btn btn-op" id="btn-add" onclick="calc.op('+')">+</button>

      <button class="btn btn-num btn-zero" onclick="calc.num('0')">0</button>
      <button class="btn btn-num" onclick="calc.dot()">.</button>
      <button class="btn btn-eq" id="btn-equals" onclick="calc.equals()">=</button>
    </div>
  </div>

  <script>
    const calc = (() => {
      const exprEl = document.getElementById('expression');
      const valEl = document.getElementById('value');

      let current = '0';
      let previous = '';
      let operator = '';
      let justEval = false;

      function render() {
        valEl.textContent = current;
        exprEl.textContent = previous && operator ? `${previous} ${operator}` : '';
      }

      function num(n) {
        if (justEval) { current = '0'; justEval = false; }
        if (current === '0' && n !== '.') current = n;
        else if (current.length < 15) current += n;
        render();
      }

      function dot() {
        if (justEval) { current = '0'; justEval = false; }
        if (!current.includes('.')) current += '.';
        render();
      }

      function op(o) {
        if (operator && !justEval) evaluate();
        previous = current;
        operator = o;
        current = '0';
        justEval = false;
        render();
      }

      function evaluate() {
        if (!operator || !previous) return;
        const a = parseFloat(previous);
        const b = parseFloat(current);
        let result;
        switch (operator) {
          case '+': result = a + b; break;
          case '−': result = a - b; break;
          case '×': result = a * b; break;
          case '÷': result = b !== 0 ? a / b : 'Lỗi'; break;
          default: return;
        }
        exprEl.textContent = `${previous} ${operator} ${current} =`;
        if (result === 'Lỗi') {
          current = 'Lỗi';
        } else {
          current = parseFloat(result.toFixed(10)).toString();
        }
        valEl.textContent = current;
        previous = '';
        operator = '';
        justEval = true;
      }

      function equals() { evaluate(); }

      function clear() {
        current = '0'; previous = ''; operator = ''; justEval = false;
        render();
      }

      function del() {
        if (justEval) return;
        current = current.length > 1 ? current.slice(0, -1) : '0';
        render();
      }

      function percent() {
        current = (parseFloat(current) / 100).toString();
        render();
      }

      document.addEventListener('keydown', e => {
        if (e.key >= '0' && e.key <= '9') num(e.key);
        else if (e.key === '.') dot();
        else if (e.key === '+') op('+');
        else if (e.key === '-') op('−');
        else if (e.key === '*') op('×');
        else if (e.key === '/') { e.preventDefault(); op('÷'); }
        else if (e.key === '%') percent();
        else if (e.key === 'Enter' || e.key === '=') equals();
        else if (e.key === 'Backspace') del();
        else if (e.key === 'Escape' || e.key === 'Delete') clear();
      });

      render();
      return { num, dot, op, equals, clear, del, percent };
    })();
  </script>

</body>

</html>
